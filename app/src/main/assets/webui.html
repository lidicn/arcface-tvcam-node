<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ArcFace 人脸注册管理</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0f1320; color: #e6e9ef;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 20px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .header-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .nav { display: flex; gap: 8px; }
  .nav a { color: #8a93a6; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid #2c3550; }
  .nav a:hover { color: #e6e9ef; border-color: #4a5a8a; }
  .nav a.active { color: #fff; background: #2a6df4; border-color: #2a6df4; }
  h2 { font-size: 15px; margin: 0 0 10px; color: #aab2c5; }
  .status { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #1c2333; color: #8a93a6; }
  .status.ok { color: #6ee7a8; }
  .status.err { color: #ff8b8b; }
  .card { background: #171c2b; border: 1px solid #232b40; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row.between { justify-content: space-between; }
  #live { width: 100%; max-height: 320px; object-fit: cover; border-radius: 10px; background: #000; margin-bottom: 12px; }
  input[type=text] { flex: 1 1 180px; min-width: 140px; padding: 10px 12px; border-radius: 10px; border: 1px solid #2c3550; background: #0f1320; color: #e6e9ef; font-size: 14px; }
  input[type=file] { flex: 1 1 200px; color: #cdd3e0; font-size: 13px; }
  button { padding: 10px 16px; border-radius: 10px; border: 1px solid #2c3550; background: #2a6df4; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  button.danger { background: #c0392b; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.ok { color: #6ee7a8; }
  .msg.err { color: #ff8b8b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .face { background: #0f1320; border: 1px solid #232b40; border-radius: 12px; padding: 10px; text-align: center; }
  .face img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; background: #000; }
  .fname { margin: 8px 0 6px; font-size: 14px; word-break: break-all; }
  .del { background: #c0392b; width: 100%; }
  .empty { color: #6b7488; font-size: 13px; padding: 12px 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <h1>ArcFace 人脸注册管理</h1>
      <div class="nav">
        <a href="/" class="active">人脸管理</a>
        <a href="/settings.html">系统设置</a>
      </div>
    </div>
    <div id="status" class="status">连接中…</div>
  </header>

  <section class="card">
    <h2>实时画面（对准摄像头拍摄，或直接上传照片注册）</h2>
    <img id="live" alt="实时画面" />
    <div class="row">
      <input id="name" type="text" placeholder="姓名（必填，唯一）" />
      <input id="file" type="file" accept="image/*" />
      <button id="register">注册</button>
    </div>
    <div id="msg" class="msg"></div>
  </section>

  <section class="card">
    <div class="row between">
      <h2>已注册人脸（<span id="count">0</span> 人）</h2>
      <button id="clear" class="danger">清空全部</button>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty">暂无注册人脸</div>
  </section>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let msgTimer = null;
  function msg(text, ok) {
    const el = $('msg');
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { el.textContent = ''; el.className = 'msg'; }, 4000);
  }

  async function health() {
    try {
      const r = await fetch('/api/health');
      const j = await r.json();
      $('status').textContent = `引擎:${j.engine} | 已注册:${j.registered} | 端口:${j.port}`;
      $('status').className = 'status ok';
    } catch (e) {
      $('status').textContent = '无法连接服务';
      $('status').className = 'status err';
    }
  }

  async function loadFaces() {
    try {
      const r = await fetch('/api/faces');
      const j = await r.json();
      const grid = $('grid');
      grid.innerHTML = '';
      $('count').textContent = j.count;
      $('empty').style.display = j.count ? 'none' : 'block';
      (j.faces || []).forEach((f) => {
        const card = document.createElement('div');
        card.className = 'face';
        const img = document.createElement('img');
        img.src = f.image; img.alt = f.name;
        const name = document.createElement('div');
        name.className = 'fname'; name.textContent = f.name;
        const del = document.createElement('button');
        del.className = 'del'; del.textContent = '删除';
        del.onclick = () => delFace(f.name);
        card.append(img, name, del);
        grid.append(card);
      });
    } catch (e) { /* 忽略刷新错误 */ }
  }

  async function register() {
    const name = $('name').value.trim();
    const file = $('file').files[0];
    if (!name) { msg('请填写姓名', false); return; }
    if (!file) { msg('请选择照片', false); return; }
    try {
      const res = await fetch('/api/register?name=' + encodeURIComponent(name), {
        method: 'POST',
        headers: { 'Content-Type': file.type || 'image/jpeg' },
        body: file,
      });
      const j = await res.json();
      if (j.success) {
        msg('注册成功：' + j.name + '（共 ' + j.registered + ' 人）', true);
        $('name').value = ''; $('file').value = '';
        loadFaces();
      } else {
        msg('注册失败：未检测到人脸或图片无效', false);
      }
    } catch (e) {
      msg('注册请求失败：' + e.message, false);
    }
  }

  async function delFace(name) {
    if (!confirm('删除人脸「' + name + '」？')) return;
    try {
      const res = await fetch('/api/face?name=' + encodeURIComponent(name), { method: 'DELETE' });
      const j = await res.json();
      if (j.deleted) { msg('已删除：' + name, true); loadFaces(); }
      else { msg('删除失败（可能已不存在）', false); }
    } catch (e) {
      msg('删除请求失败：' + e.message, false);
    }
  }

  $('register').onclick = register;
  $('clear').onclick = async () => {
    if (!confirm('确定清空全部人脸？')) return;
    try {
      const res = await fetch('/api/clear', { method: 'POST' });
      const j = await res.json();
      msg('已清空 ' + j.deleted + ' 条', true);
      loadFaces();
    } catch (e) { msg('清空失败：' + e.message, false); }
  };

  // 实时画面自动刷新
  setInterval(() => { $('live').src = '/api/snapshot?t=' + Date.now(); }, 1000);
  health();
  loadFaces();
  setInterval(loadFaces, 3000);
</script>
</body>
</html>
